name: disney-expert

# =====================================================================
# DISNEY EXPERT · Infraestrutura
#
# Três serviços: banco, aplicação e proxy.
# O banco NÃO publica porta para fora. Ele só é alcançável pela rede
# interna do Docker, o que evita o erro mais comum em VPS, que é deixar
# o PostgreSQL exposto na internet.
#
# Subir tudo:      docker compose up -d
# Ver o que roda:  docker compose ps
# Ler os registros: docker compose logs -f app
# =====================================================================

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: America/Sao_Paulo
    volumes:
      - db_data:/var/lib/postgresql/data
      # Init automático na PRIMEIRA subida, em ordem determinística:
      # schema base e depois as migrações. Os seeds de demonstração NÃO
      # entram aqui (são só para homologação — ver infra/DEPLOY.md).
      - ./sql/schema_disney_expert.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./sql/migracao_002_status_sla.sql:/docker-entrypoint-initdb.d/02_status_sla.sql:ro
      - ./sql/migracao_003_id_reserva_crm.sql:/docker-entrypoint-initdb.d/03_id_reserva.sql:ro
      - ./sql/migracao_004_bi_financeiro.sql:/docker-entrypoint-initdb.d/04_bi.sql:ro
      - ./sql/migracao_005_portal_agentes.sql:/docker-entrypoint-initdb.d/05_portal.sql:ro
      - ./sql/migracao_006_kanban_consultoras.sql:/docker-entrypoint-initdb.d/06_kanban.sql:ro
      - ./sql/migracao_007_consultoras_reais.sql:/docker-entrypoint-initdb.d/07_consultoras.sql:ro
      - ./sql/migracao_008_leads_marketing.sql:/docker-entrypoint-initdb.d/08_leads.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - interna

  app:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      TZ: America/Sao_Paulo
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "3000"
    networks:
      - interna

  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMINIO: ${DOMINIO}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    networks:
      - interna

volumes:
  db_data:
  caddy_data:
  caddy_config:

networks:
  interna:
    driver: bridge
